name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  safety-and-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned sources without game data
        run: ./scripts/bootstrap-dependencies.sh --sources-only
      - name: Repository safety and focused tests
        run: ./scripts/check-repository.sh

  apple-build:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        lane: [ios, tvos]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned dependencies
        run: ./scripts/bootstrap-dependencies.sh
      - name: Compile runtime and app without game inputs
        run: ./scripts/check-apple-build.sh ${{ matrix.lane }}
